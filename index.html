<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>eng_WordList_MdByStry</title>
    <style>
      html,body{
        margin : 0;
        overflow-x: hidden;
        width: 100%;
      }
      div.qlist {
        position : absolute;
        transform : translateX(-50%);
        left : 50%;
        background-color : rgb(230,230,230);
        border-radius : 16px;
        width : 500px;
        border : solid 1px black;

        display : flex;
        flex-direction : column;
      }
      div.q {
        display : flex;
        flex-direction : column;
      }
      button {
        cursor : pointer;
        border : solid 2px;
        border-radius : 4px;
        width : 60;
        height : 60px;
      }
      .on {
        background-color : rgb(250,250,250);
      }
      .off {
        background-color : rgb(100,100,100);
      }
      .correct {
        background-color : rgb(100,200,0);
      }
      .wrong {
        color : white;
        background-color : rgb(200,10,0);
      }
      .fish {
        display:none;
      }
      .fish_js {
        display : inline-block;
        position : absolute;
        top : 15%;
        left : 150%;
        animation-name : jumpscare;
        animation-duration : 3s;
        animation-fill-mode:forwards;
      }
      .shiny {
        filter: invert(100%);
      }
      
      @keyframes jumpscare{
        0% {left: 1000%}
        20% {left: 25%}
        75% {left: 35%}
        80% {left: 30%}
        100% {display:none}
      }

    </style>
  </head>

  <body onload="start()">
    <div class="qlist">
      <h1>영단어장_교과
      <select id="part">
          <option value=0>1단원</option>
          <option value=1>2단원</option>
      </select>
      <button id="show_WL">단어보기</button>
      </h1>
      <div>
        <select id="quest">
          <option value=0>영어</option>
          <option value=2>국어</option>
          <option value=3>영영풀이</option>
        </select>

        To
        <select id="answer">
          <option value=0>영어</option>
          <option value=1>품사</option>
          <option value=2 selected>국어</option>
          <option value=3>영영풀이</option>
        </select>
        Filter
        <select id="filter">
          <option value=0>맞춘 것만 보기</option>
          <option value=1>틀린 것만 보기</option>
          <option value=2 selected>모두 보기</option>
        </select>
      </div>
      <div id="q"></div>
      <div>
        <button id="check" class="on">채점하다</button>
        <button id="reset" class="off">다시하다</button>
      </div>
    </div>
    <div>
      <img id="fish" class="fish" src="fish.png" alt="대구" style="scale:1.15">
    </div>
  </body>

  <script>
    let shiny_val = 1;
    let qu_val = 0;
    let cor_count = [];
    let mode = [0,2];
    // mode[0] to mode[1]

    let quList = [];
    let qu_lamda = [];
    
    const q = document.getElementById('q');
    const check = document.getElementById('check');
    const reset = document.getElementById('reset');
    const part = document.getElementById("part");
    const quest = document.getElementById("quest");
    const answer = document.getElementById("answer");
    const show_WL = document.getElementById("show_WL");
    const fish = document.getElementById("fish");
    const filter = document.getElementById("filter");

    check.addEventListener('click',ch);
    reset.addEventListener('click',re);
    quest.addEventListener('change',change);
    answer.addEventListener('change',change);
    filter.addEventListener('change',filter_f);
    
    const pos = {"n":"명사","p":"대명사","v":"동사","a":"형용사","ad":"부사","conj":"접속사","intj":"감탄사","prep":"전치사"}

    function filter_f() {
      if (show_WL.innerHTML == "단어보기"){
        qu_lamda.forEach((word,index) => {
          document.getElementById(`row_${index}`).style.display = "block";
        })
        if (filter.value == 0) {
          qu_lamda.forEach((word,index) => {
            if (!cor_count.includes(word.join('/'))) {
                document.getElementById(`row_${index}`).style.display = "none";
            }
          });
        }
        if (filter.value == 1) {
          qu_lamda.forEach((word,index) => {
            if (cor_count.includes(word.join('/'))) {
                document.getElementById(`row_${index}`).style.display = "none";
            }
          })
        }
      }
      else{
        quList[qu_val].forEach((word,index) => {
          document.getElementById(`row_${index}`).style.display = "block";
        })
        if (filter.value == 0) {
          quList[qu_val].forEach((word,index) => {
            if (!cor_count.includes(word.join('/'))) {
                document.getElementById(`row_${index}`).style.display = "none";
            }
          });
        }
        if (filter.value == 1) {
          quList[qu_val].forEach((word,index) => {
            if (cor_count.includes(word.join('/'))) {
                document.getElementById(`row_${index}`).style.display = "none";
            }
          })
        }
      }
    }
    
    function roll() {
      fish.classList.replace("fish_js","fish");
      qu_lamda = quList[qu_val].slice();
      qu_lamda.sort(()=>Math.random()-0.5);

      qu_lamda.forEach((word,index)=>{
        var row = document.createElement('div');
        var id = document.createElement('div');
        var input = document.createElement('input');

        row.style = "display:flex;margin-top:10px;margin-left:2%;border-bottom:solid 1px black;width:96%"
        row.id = `row_${index}`;
        
        id.innerHTML = `${word[mode[0]]}:`;
        id.style = "width:100%";

        input.id = index;
        input.style = "border:none;background-color:rgba(255,255,255,0.8);width:99%";
        
        row.appendChild(id);
        row.appendChild(input);
        q.appendChild(row)
      });
      filter_f()
    }

    function load(quN) {
        q.replaceChildren();
        reset.classList.replace('on','off');
        check.classList.replace('off','on');
        qu_val = quN;
        roll();
    }

    function change() {
      mode[0] = quest.value;
      mode[1] = answer.value;
      if (show_WL.innerHTML == "단어보기"){
        reset.classList.replace('on','off');
        check.classList.replace('off','on');
        q.replaceChildren();
        roll();
      }
      else{
        show_WL.innerHTML = "단어보기";
        show_WL_f()
      }
    }

    part.addEventListener('change',()=>{
      if (show_WL.innerHTML == "단어보기"){
        load(part.value);
      }
      else {
        qu_val = part.value;
        show_WL.innerHTML = "단어보기";
        show_WL_f();
      }
    })
    
    function ch() {
      if (check.classList.contains('on')){
        let cor_ans = 0;
        window.scrollTo(0, 0);
        check.classList.replace('on','off');
        reset.classList.replace('off','on');
        qu_lamda.forEach((word,index)=>{
          let cor = word[mode[1]].split(',').map(item => item.trim());

          if (cor.includes(document.getElementById(index).value)) {
            document.getElementById(`row_${index}`).classList.add("correct");
            cor_ans ++;
            if (!cor_count.includes(word.join('/'))) {
              cor_count.push(word.join('/'));
              localStorage.setItem('eng_wordlist_MdByStry_cor_count_s', JSON.stringify(cor_count));
              if (cor_count.length%20==0 && shiny_val<8) {
                shiny_val *= 2;
              }
            }
          }
          else {
            if (!cor_count.includes(word.join('/'))) {
              document.getElementById(`row_${index}`).classList.add("wrong");
              document.getElementById(index).value = word[mode[1]];
            }
            else if (filter.value != 1) {
              document.getElementById(`row_${index}`).classList.add("wrong");
              document.getElementById(index).value = word[mode[1]];
            }
          }
        })
        if (cor_ans <= 5){
          fish.classList.replace("fish","fish_js");
          if (Math.floor(Math.random()*(4096)+1) <= shiny_val) {
            fish.classList.add("shiny");
          }
        }
      }
    }
    
    function re() {
      if (reset.classList.contains('on')){
        window.scrollTo(0, 0);
        reset.classList.replace('on','off');
        check.classList.replace('off','on');
        q.replaceChildren();
        roll()
      }
    }
    
    function show_WL_f(){
      if (show_WL.innerHTML == "단어보기") {
        q.replaceChildren();
        
        quList[qu_val].forEach((word,index)=>{
          var row = document.createElement('div');
          var id = document.createElement('div');
          var value = document.createElement('div');
  
          row.style = "display:flex;margin-top:10px;margin-left:2%;border-bottom:solid 1px black;width:96%"
          if (cor_count.includes(word.join('/'))){
            row.classList.add("correct");
          }
          row.id = `row_${index}`
          
          id.innerHTML = `${word[mode[0]]}:`;
          id.style = "width:30%";

          value.innerHTML = `${word[mode[1]]}`;
          value.style = "border:none;background-color:rgba(255,255,255,0.8);width:100%";
          if (!cor_count.includes(word.join('/'))) {
            value.innerHTML = '???';
          }
          
          row.appendChild(id);
          row.appendChild(value);
          q.appendChild(row);
        })
        show_WL.innerHTML = "문제풀기";
        reset.classList.replace('on','off');
        check.classList.replace('on','off');
        filter_f();
      }
      else{
        show_WL.innerHTML = "단어보기";
        reset.classList.replace('on','off');
        check.classList.replace('off','on');
        q.replaceChildren();
        roll()
      }
    }

    show_WL.addEventListener('click',show_WL_f);

  </script>  
</html>
